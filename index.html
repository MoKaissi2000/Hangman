<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Bootstrap 4 CDN -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <title>Hangman</title>

  <!-- CSS to style the keyboard -->
  <style>
    #keyboard {
      margin-top: 20px;
    }
    .keyboard-row {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .keyboard-row:first-child {
      margin-left: 0;
    }
    .keyboard-row:nth-child(2) {
      margin-left: 30px; /* indent the second row */
    }
    .keyboard-row:nth-child(3) {
      margin-left: 60px; /* indent the third row */
    }
    .btn {
      width: 80px;
    }
  </style>

</head>
<body>
<div class="container">
  <h1 class="text-center">Hangman</h1>
  <div class="float-right">
    Wrong Guesses: <span id='mistakes'>0</span> of <span id='maxWrong'></span>
    <br>
    <span id="hint">Hint: None</span> <!-- This is added now correctly -->
  </div>
  <div class="text-center">
    <img id='hangmanPic' src="./images/0.jpg" alt="">
    <!-- REMOVED the "Guess the Programming Language" line completely -->
    <p id="wordSpotlight">The word to be guessed goes here</p>
    <div id="keyboard"></div> <!-- This is where keyboard will be generated -->
    <button class="btn btn-info" onClick="reset()">Reset </button>
  </div> 
</div>

<script src='hangman.js'></script>
</body>
</html>
